<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon 爬塔</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      body {
        background: #0a0e1a;
        color: #e2e8f0;
        font-family: 'Noto Sans TC', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Animations ── */
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes slideInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: none; } }
      @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
      @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
      @keyframes flash { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes glow { 0%,100% { box-shadow: 0 0 8px #6366f1; } 50% { box-shadow: 0 0 20px #818cf8, 0 0 40px #6366f1; } }
      @keyframes floatUp { from { opacity:1; transform: translateY(0) scale(1); } to { opacity:0; transform: translateY(-40px) scale(1.3); } }
      @keyframes bossGlow { 0%,100% { border-color: #ef4444; box-shadow: 0 0 12px #ef4444; } 50% { border-color: #f97316; box-shadow: 0 0 24px #f97316; } }
      @keyframes lunge { 0%,100% { transform: translateX(0); } 40% { transform: translateX(55px); } }
      /* lungeFull: --lunge-x is set dynamically per-attack so the sprite reaches the enemy */
      @keyframes lungeFull {
        0%   { transform: translateX(0) scaleX(1); }
        35%  { transform: translateX(calc(var(--lunge-x, 175px) * 0.6)) scaleX(1.12); }
        52%  { transform: translateX(var(--lunge-x, 175px)) scaleX(1.05); }
        68%  { transform: translateX(var(--lunge-x, 175px)) scaleX(1); }
        100% { transform: translateX(0) scaleX(1); }
      }
      @keyframes lungeSpinFull {
        0%   { transform: translateX(0) rotate(0deg) scaleX(1); }
        30%  { transform: translateX(calc(var(--lunge-x, 175px) * 0.5)) rotate(120deg) scaleX(1.1); }
        55%  { transform: translateX(var(--lunge-x, 175px)) rotate(180deg) scaleX(1); }
        72%  { transform: translateX(var(--lunge-x, 175px)) rotate(180deg) scaleX(1); }
        100% { transform: translateX(0) rotate(0deg) scaleX(1); }
      }
      @keyframes enemyLunge { 0% { transform: translateX(0); } 40% { transform: translateX(-160px); } 100% { transform: translateX(0); } }
      @keyframes statusAura { 0%,100% { filter: brightness(1); } 50% { filter: brightness(2.5) saturate(3) hue-rotate(30deg); } }
      @keyframes projectileFly { 0% { left:110px; bottom:120px; opacity:1; transform:scale(1.4); } 100% { left:calc(100% - 60px); bottom:115px; opacity:0; transform:scale(0.5); } }
      @keyframes beamExpand { 0% { width:0; opacity:1; } 60% { width:calc(100% - 130px); opacity:1; } 100% { width:calc(100% - 130px); opacity:0; } }
      @keyframes floatText { 0% { opacity:1; transform:translateY(0) scale(1); } 100% { opacity:0; transform:translateY(-60px) scale(1.15); } }
      @keyframes ballArc { 0% { left:30px; bottom:70px; opacity:1; } 50% { left:50%; bottom:165px; } 100% { left:calc(100% - 90px); bottom:120px; opacity:1; } }
      @keyframes speedLine { 0% { opacity:0.85; transform:scaleX(0); transform-origin:left; } 55% { opacity:0.85; transform:scaleX(1); transform-origin:left; } 100% { opacity:0; transform:scaleX(1); transform-origin:right; } }
      @keyframes impactBurst { 0% { transform:scale(0.2); opacity:1; } 100% { transform:scale(4); opacity:0; } }
      @keyframes impactBurst2 { 0% { transform:translate(-50%,-50%) scale(0.1); opacity:1; } 70% { opacity:1; } 100% { transform:translate(-50%,-50%) scale(3.5); opacity:0; } }
      @keyframes screenFlash { 0% { opacity:0; } 8% { opacity:1; } 100% { opacity:0; } }
      @keyframes screenFlashHard { 0% { opacity:0; } 4% { opacity:1; } 18% { opacity:0.9; } 100% { opacity:0; } }
      @keyframes floatText2 { 0% { opacity:1; transform:translate(-50%,0) scale(0.7); } 50% { opacity:1; transform:translate(-50%,-28px) scale(1.2); } 100% { opacity:0; transform:translate(-50%,-58px) scale(1); } }
      @keyframes critFlash { 0%,100% { filter:brightness(1) saturate(1); } 25% { filter:brightness(3) saturate(0) hue-rotate(0deg); } 50% { filter:brightness(2.5) saturate(4) hue-rotate(60deg); } }
      @keyframes shockwave { 0% { transform:translate(-50%,-50%) scale(0); opacity:1; } 100% { transform:translate(-50%,-50%) scale(2.5); opacity:0; } }
      @keyframes shockwaveBig { 0% { transform:translate(-50%,-50%) scale(0); opacity:1; border-width:5px; } 100% { transform:translate(-50%,-50%) scale(5); opacity:0; border-width:1px; } }
      @keyframes clawSlash { 0% { opacity:0; transform-origin:right center; transform:scaleX(0) rotate(var(--r,0deg)); } 12% { opacity:1; transform:scaleX(1.2) rotate(var(--r,0deg)); } 100% { opacity:0; transform:scaleX(1.2) rotate(var(--r,0deg)); } }
      @keyframes thunderZap { 0% { opacity:1; filter:brightness(3) drop-shadow(0 0 12px #fff); } 12% { opacity:1; filter:brightness(2) drop-shadow(0 0 20px #facc15); } 28% { opacity:0.2; filter:brightness(1); } 40% { opacity:0.9; filter:brightness(2.5) drop-shadow(0 0 10px #facc15); } 55% { opacity:0; } 68% { opacity:0.7; } 80% { opacity:0; } }
      @keyframes thunderZapLine { 0% { stroke-dashoffset:600; opacity:1; filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 20px #facc15); } 30% { stroke-dashoffset:0; opacity:1; } 60% { opacity:0.5; } 100% { opacity:0; } }
      @keyframes flamePuff { 0% { transform:scale(0) translateY(0); opacity:1; } 60% { transform:scale(1.5) translateY(-18px); opacity:0.8; } 100% { transform:scale(2.2) translateY(-36px); opacity:0; } }
      @keyframes iceShatter { 0% { transform:translate(0,0) scale(0) rotate(0deg); opacity:1; } 100% { transform:translate(var(--dx,40px),var(--dy,-50px)) scale(1.5) rotate(360deg); opacity:0; } }
      @keyframes shadowVoid { 0% { transform:scale(0); opacity:0.9; } 55% { transform:scale(1.2); opacity:0.7; } 100% { transform:scale(2.5); opacity:0; filter:blur(6px); } }
      @keyframes crossSlashH { 0% { transform-origin:right center; transform:scaleX(0); opacity:1; } 45% { transform:scaleX(1.1); opacity:1; } 100% { transform:scaleX(1.1); opacity:0; } }
      @keyframes crossSlashV { 0% { transform-origin:center bottom; transform:scaleY(0); opacity:1; } 45% { transform:scaleY(1.1); opacity:1; } 100% { transform:scaleY(1.1); opacity:0; } }
      @keyframes leafWhirl { 0% { transform:translate(0,0) scale(0) rotate(0deg); opacity:1; } 100% { transform:translate(var(--dx,30px),var(--dy,-60px)) scale(1.2) rotate(540deg); opacity:0; } }
      /* leafFly: 從玩家出發向右飛行到敵人，途中旋轉，抵達後縮小消失 */
      @keyframes leafFly {
        0%   { transform: translate(0, var(--ly,0px)) scale(1.1) rotate(0deg);   opacity: 1; }
        55%  { transform: translate(var(--lx,180px), var(--ly,0px)) scale(1.3) rotate(360deg); opacity: 1; }
        75%  { transform: translate(var(--lx,180px), var(--ly,0px)) scale(1.5) rotate(400deg); opacity: 0.8; }
        100% { transform: translate(calc(var(--lx,180px) + 20px), calc(var(--ly,0px) - 20px)) scale(0) rotate(500deg); opacity: 0; }
      }
      @keyframes waveSweep { 0% { transform-origin:left; transform:scaleX(0); opacity:1; } 60% { transform:scaleX(1); opacity:1; } 100% { transform:scaleX(1); opacity:0; } }
      @keyframes slamDrop { 0% { transform:translateX(-50%) translateY(-10px) scale(0.4); opacity:0; } 20% { opacity:1; } 70% { transform:translateX(-50%) translateY(130px) scale(1.2); opacity:1; } 100% { transform:translateX(-50%) translateY(130px) scale(1); opacity:0; } }
      /* jumpSlam: 跳起 → 飛越場地 → 砸在敵方身上 → 彈回 */
      @keyframes jumpSlam {
        0%   { transform: translateX(0) translateY(0) scaleX(1) scaleY(1); }
        22%  { transform: translateX(calc(var(--lunge-x,175px)*0.3)) translateY(-80px) scaleX(0.85) scaleY(1.2); }
        48%  { transform: translateX(calc(var(--lunge-x,175px)*0.85)) translateY(-110px) scaleX(0.8) scaleY(1.25); }
        64%  { transform: translateX(var(--lunge-x,175px)) translateY(0px) scaleX(1.3) scaleY(0.7); }
        72%  { transform: translateX(var(--lunge-x,175px)) translateY(-14px) scaleX(1.1) scaleY(0.95); }
        82%  { transform: translateX(var(--lunge-x,175px)) translateY(0) scaleX(1) scaleY(1); }
        100% { transform: translateX(0) translateY(0) scaleX(1) scaleY(1); }
      }
      @keyframes tailSwing { 0% { transform:scaleX(0) scaleY(0.3); opacity:0; } 40% { transform:scaleX(1.15) scaleY(1.1); opacity:1; } 100% { transform:scaleX(1.1) scaleY(1); opacity:0; } }
      /* weakLunge: 虛弱地蹣跚向前，只走到一半，軟趴趴地回來 */
      @keyframes weakLunge {
        0%   { transform: translateX(0) scaleY(1); }
        15%  { transform: translateX(12px) scaleY(0.92); }
        38%  { transform: translateX(calc(var(--lunge-x,175px)*0.42)) scaleY(0.95); }
        52%  { transform: translateX(calc(var(--lunge-x,175px)*0.45)) scaleY(1); }
        60%  { transform: translateX(calc(var(--lunge-x,175px)*0.38)) rotate(-5deg); }
        78%  { transform: translateX(18px) rotate(0deg) scaleY(0.97); }
        100% { transform: translateX(0) scaleY(1); }
      }
      /* weakPunchFly: 拳頭無力地滑向敵方，速度緩慢 */
      @keyframes weakPunchFly {
        0%   { transform: translateX(0) translateY(0); opacity: 0.5; }
        40%  { transform: translateX(80px) translateY(8px); opacity: 0.8; }
        70%  { transform: translateX(145px) translateY(4px); opacity: 0.9; }
        85%  { transform: translateX(150px) translateY(0); opacity: 0.6; }
        100% { transform: translateX(155px) translateY(-5px); opacity: 0; }
      }
      @keyframes lungeSpinFull { 0% { transform:translateX(0) rotate(0deg) scaleX(1); } 35% { transform:translateX(80px) rotate(180deg) scaleX(1.1); } 65% { transform:translateX(160px) rotate(180deg) scaleX(1); } 100% { transform:translateX(0) rotate(0deg) scaleX(1); } }
      @keyframes statusRing { 0%,100% { transform:scale(1); opacity:0; } 50% { transform:scale(1.4); opacity:0.7; } }
      @keyframes poisonDrip { 0% { transform:translateY(0) scale(1); opacity:1; } 100% { transform:translateY(60px) scale(0.5); opacity:0; } }
      @keyframes rockFall { 0% { transform:translate(var(--rx,0px),-30px) rotate(0deg); opacity:1; } 70% { transform:translate(var(--rx,0px),80px) rotate(180deg); opacity:1; } 100% { transform:translate(var(--rx,0px),80px) rotate(200deg); opacity:0; } }
      @keyframes windSwirl { 0% { transform:scale(0) rotate(0deg); opacity:0; } 50% { transform:scale(1.3) rotate(180deg); opacity:1; } 100% { transform:scale(2) rotate(360deg); opacity:0; } }

      .anim-fade-in { animation: fadeIn 0.35s ease both; }
      .anim-slide-left { animation: slideInLeft 0.35s ease both; }
      .anim-slide-right { animation: slideInRight 0.35s ease both; }
      .anim-bounce { animation: bounce 1.8s ease-in-out infinite; }
      .anim-pulse { animation: pulse 2s ease-in-out infinite; }
      .anim-boss-glow { animation: bossGlow 1.5s ease-in-out infinite; }

      .btn-hover:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-2px); transition: all 0.12s; }
      .btn-hover:active:not(:disabled) { transform: translateY(0) scale(0.97); }
      button { transition: all 0.12s; }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

      /* HP bar animation */
      .hp-fill { transition: width 0.5s ease, background-color 0.5s ease; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
